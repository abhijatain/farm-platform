
[project]
name = "satellite-worker"
version = "0.1.0"
description = "Satellite processing worker for Farm Platform"
requires-python = ">=3.12"

dependencies = [
    "google-cloud-storage>=3.4.0",
    "numpy>=2.0",
    "pydantic-settings>=2.0",
    "pystac-client>=0.8",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "rio-cogeo>=5.4",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "scipy>=1.14",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = [
    "src/satellite_worker",
]
